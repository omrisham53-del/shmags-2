<!doctype html>
<title>Chess Drills</title>
<style>
:root {
  --bg: #f5f3ee; --panel: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
  --board-light: #eeeed2; --board-dark: #769656; --accent: #3b6ea5;
  --correct: #2e7d32; --wrong: #c0392b; --border: #d8d4cb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --panel: #262626; --text: #ececec; --muted: #9a9a9a;
    --board-light: #b9b9a0; --board-dark: #4d6b3a; --accent: #6ea0d8;
    --correct: #4caf50; --wrong: #e57373; --border: #3a3a3a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1b; --panel: #262626; --text: #ececec; --muted: #9a9a9a;
  --board-light: #b9b9a0; --board-dark: #4d6b3a; --accent: #6ea0d8;
  --correct: #4caf50; --wrong: #e57373; --border: #3a3a3a;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif;
       display: flex; flex-direction: column; align-items: center; padding: 24px 12px; margin: 0; }
h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; text-align: center; max-width: 520px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
         max-width: 640px; width: 100%; }
.status-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
              font-size: 0.85rem; color: var(--muted); }
#turnIndicator { font-weight: 700; font-size: 0.95rem; color: var(--text); display: flex; align-items: center; gap: 6px; }
#turnIndicator .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block;
                       border: 1.5px solid var(--text); }
#turnIndicator .dot.white { background: #f5f5f0; }
#turnIndicator .dot.black { background: #2a2a2a; }
.stopwatch { display: flex; align-items: baseline; gap: 5px; }
#clock { font-weight: 700; font-size: 1rem; color: var(--text); font-variant-numeric: tabular-nums; }
#clock.over-target { color: var(--wrong); }
#targetLabel { font-size: 0.78rem; color: var(--muted); }
.time-tag { font-size: 0.82rem; margin-top: 2px; opacity: 0.85; }
.play-area { display: flex; gap: 16px; align-items: flex-start; }
.board-col { flex: 1; min-width: 0; }
#board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1;
         border: 2px solid var(--border); border-radius: 6px; overflow: hidden; }
.sq { display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 6vw, 40px);
      cursor: pointer; user-select: none; position: relative; aspect-ratio: 1; line-height: 1; }
.sq.light { background: var(--board-light); }
.sq.dark { background: var(--board-dark); }
.sq.selected { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.piece-white { color: #f7f5ef; -webkit-text-stroke: 1.3px #26251f; text-stroke: 1.3px #26251f;
               paint-order: stroke fill; }
.piece-black { color: #1b1a17; -webkit-text-stroke: 0.6px #1b1a17; text-stroke: 0.6px #1b1a17; }
.button-col { display: flex; flex-direction: column; gap: 8px; width: 150px; flex-shrink: 0; }
button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 12px 10px;
         font-size: 0.85rem; cursor: pointer; width: 100%; }
button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
button:disabled { opacity: 0.4; cursor: default; }
#feedback { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
#feedback.correct { background: color-mix(in srgb, var(--correct) 15%, transparent); color: var(--correct); display: block; }
#feedback.wrong { background: color-mix(in srgb, var(--wrong) 15%, transparent); color: var(--wrong); display: block; }
#feedbackMove { font-weight: 600; }
#explanation { margin-top: 8px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
               color: var(--text); font-size: 0.88rem; line-height: 1.45; }
#summary { display: none; text-align: center; }
#summary table { width: 100%; margin: 12px 0; font-size: 0.9rem; }
#summary td { padding: 4px 0; }
#summary td:last-child { text-align: right; font-weight: 600; }
@media (max-width: 560px) {
  .play-area { flex-direction: column; }
  .button-col { flex-direction: row; width: 100%; }
}
</style>

<h1>Chess Drills</h1>
<div class="sub">Commit a move before you see anything. No position tells you whether it's winning, losing, or equal -- that's the point.</div>

<div class="panel">
  <div id="quiz">
    <div class="status-row">
      <span id="counter">Drill 1 / N</span>
      <span id="turnIndicator"></span>
      <span class="stopwatch"><span id="clock">0</span><span id="targetLabel"></span></span>
    </div>
    <div class="play-area">
      <div class="board-col">
        <div id="board"></div>
        <div id="feedback"></div>
      </div>
      <div class="button-col">
        <button class="secondary" id="skipBtn">Don't know / skip</button>
        <button id="nextBtn" disabled>Next drill</button>
      </div>
    </div>
  </div>
  <div id="summary">
    <h2 style="margin:0 0 8px;font-size:1rem;">Session done</h2>
    <table id="summaryTable"></table>
    <button id="restartBtn">Run again</button>
  </div>
</div>

<script>
const DRILLS = [{"source": "own_null", "fen": "8/8/8/5k2/4R3/3Kp1r1/8/8 w - - 2 53", "correct_move_uci": "e4e7", "correct_move_san": "Re7", "source_game_id": 1460, "ply": 105, "explanation": "A dead-equal rook endgame -- Re7, Rh4, Rxe3, and several other rook moves are all exactly 0.00 here. Nothing to calculate, just don't do anything careless.", "id": 0, "acceptable_moves_uci": ["e4e8", "e4e3", "e4a4", "e4c4", "e4b4", "e4h4", "e4e7"]}, {"source": "lichess_puzzle", "fen": "4R3/5Q1p/2q4k/6p1/8/8/PPr2nPP/4R1K1 b - - 0 25", "correct_move_uci": "f2h3", "correct_move_san": null, "puzzle_id": "8zIyd", "rating": "1164", "themes": "endgame mate mateIn2 sacrifice short", "explanation": "Nh3+ forces gxh3, the only way to deal with the check, then Qg2 is mate -- the king has nowhere left to go. A classic knight-sac-to-clear-the-mating-square pattern.", "id": 1, "acceptable_moves_uci": ["f2h3"]}, {"source": "own_null", "fen": "rn2kb1r/1pp2ppp/p3p3/4N3/3PpBPq/4P2P/PPP2P2/R2QK2R w KQkq - 0 12", "correct_move_uci": "c2c3", "correct_move_san": "c3", "source_game_id": 1506, "ply": 23, "explanation": "You're already a bit better here and c3, c4, or Nc4 all keep a similar edge by solidifying the center before pushing further. Not a single key move -- just don't loosen your position for no reason.", "id": 2, "acceptable_moves_uci": ["c2c3", "c2c4"]}, {"source": "own_blunder", "fen": "2rq1rk1/6pp/pp1b4/8/P1p5/4N3/2P1Q1PP/R2R2K1 b - - 0 32", "correct_move_uci": "d8e7", "correct_move_san": "Qe7", "source_game_id": 1450, "ply": 64, "explanation": "Qe7 keeps the full advantage (+455), eyeing ...Bc5 next. In the real game this position is drawn from, Qc7 was played instead, giving back a big chunk of the edge (+196) for no real reason.", "id": 3, "acceptable_moves_uci": ["d8e7"]}, {"source": "own_null", "fen": "3r4/6pk/p6p/P7/3p2q1/8/1PPQ3P/4R2K b - - 3 38", "correct_move_uci": "g4f3", "correct_move_san": "Qf3+", "source_game_id": 1455, "ply": 76, "explanation": "Roughly balanced queen endgame -- Qf3+, Rf8, and Kh8 are all within 15 points of each other. Trading checks or just repositioning, it doesn't matter much which here.", "id": 4, "acceptable_moves_uci": ["g4f3", "g4h5", "h7h8", "d8f8", "d4d3", "g4d7"]}, {"source": "own_blunder", "fen": "rn1qkb1r/pp2p1p1/2p2n1p/4N3/2BP2b1/8/PPP2PPP/R1BQK2R b KQ - 5 9", "correct_move_uci": "d8a5", "correct_move_san": "Qa5+", "source_game_id": 1487, "ply": 18, "explanation": "Qa5+ keeps real pressure (forking the king and threatening ...Qxe5+ next). In the real game this is drawn from, e6 was played instead, ignoring the bishop hanging on g4 -- White's Nxg4 won it outright. Worth flagging the move that LOOKS best here and isn't: Bxd1 grabs the queen for a bishop, but it allows Bf7# -- immediate mate. Your king on e8 has no escape once that lands: d7 and f7 are both covered by the knight on e5, and e7, f8, d8 are all blocked by your own pawn, bishop, and queen. Qa5+ wins specifically because it's check, which takes that whole idea off the table for White.", "id": 5, "acceptable_moves_uci": ["d8a5"]}, {"source": "own_blunder", "fen": "5rk1/6pp/4p3/4Pp2/1b1p1P2/3p1N1P/1Pr3P1/1R1R3K b - - 2 29", "correct_move_uci": "d3d2", "correct_move_san": "d2", "source_game_id": 1449, "ply": 58, "explanation": "Your d-pawn is two squares from queening with real threats behind it (+256). In the real game, Rb8 was played instead, which doesn't address that at all -- the chance to press it evaporated, and the position dropped to roughly equal instead of a clear advantage.", "id": 6, "acceptable_moves_uci": ["d3d2"]}, {"source": "lichess_puzzle", "fen": "8/p7/3krR2/4n1P1/8/1P1pB3/P4K2/8 b - - 2 54", "correct_move_uci": "e5g4", "correct_move_san": null, "puzzle_id": "Aw5wb", "rating": "1061", "themes": "advantage endgame fork master short", "explanation": "Ng4+ forks the king and the bishop on e3 in one move -- check first, then the bishop's gone next. Rxf6+ looks tempting too but it's dramatically weaker (+2 instead of +252) since it gives up the fork for a much smaller gain.", "id": 7, "acceptable_moves_uci": ["e5g4"]}, {"source": "own_blunder", "fen": "5k2/pp1rp1bQ/4Rrp1/q1p2pN1/2P3P1/1P3N2/P4P1P/6K1 b - - 5 30", "correct_move_uci": "f5g4", "correct_move_san": "fxg4", "source_game_id": 1479, "ply": 60, "explanation": "fxg4 just wins the piece sitting there (+329). In the real game, Rd1+ was played instead -- a check, but it doesn't grab any material, and the follow-up (Kg2, then White's Rxe7) handed back most of the advantage for the privilege of checking first.", "id": 8, "acceptable_moves_uci": ["f5g4"]}, {"source": "own_null", "fen": "r2q1rk1/4bppp/2n1p3/3pPn2/1PpP4/4BN1P/1P1QNPP1/1R3RK1 b - - 0 17", "correct_move_uci": "c6b4", "correct_move_san": "Nxb4", "source_game_id": 1449, "ply": 34, "explanation": "A pawn's hanging on b4 and several ways to deal with it work about equally well -- Nxb4, Bxb4, and Rb8 all land within 20 points of each other.", "id": 9, "acceptable_moves_uci": ["c6b4", "e7b4", "d8b6", "a8b8", "f5e3"]}, {"source": "own_blunder", "fen": "8/7p/p5rk/8/1P3p2/P6P/4pr2/2R1R2K b - - 1 40", "correct_move_uci": "f4f3", "correct_move_san": "f3", "source_game_id": 1502, "ply": 80, "explanation": "f3 pushes your passed pawn with the game essentially decided (+1194, close to a forced win). In the real game, Rgg2 was played instead -- still winning (+664) but giving back real ground by not pressing the pawn. The game was won by checkmate anyway, but the cleaner path was sitting right there.", "id": 10, "acceptable_moves_uci": ["f4f3"]}, {"source": "own_blunder", "fen": "8/6r1/1P6/4k2p/1R5P/8/5Kp1/8 w - - 2 55", "correct_move_uci": "f2g1", "correct_move_san": "Kg1", "source_game_id": 1475, "ply": 109, "explanation": "Kg1 stops the g-pawn from ever promoting. In the real game, Rb1 was played instead, and g1=Q+ just promoted right through it, giving back almost the entire advantage for one move of carelessness.", "id": 11, "acceptable_moves_uci": ["f2g1"]}, {"source": "own_blunder", "fen": "r2qr2k/5pp1/p4b1p/1ppp1B2/5Q2/P1N5/1PP2P1P/2K3R1 w - - 0 20", "correct_move_uci": "f4f3", "correct_move_san": "Qf3", "source_game_id": 1489, "ply": 39, "explanation": "Already in real trouble here -- even Qf3, the best try available, leaves you worse (-508). In the real game, Rd1 was played instead, giving up more ground still (-768), though there wasn't a clean save on the table either way.", "id": 12, "acceptable_moves_uci": ["f4f3"]}, {"source": "lichess_puzzle", "fen": "8/7N/4p3/4kp2/1p3n2/6P1/PP1p1P2/5K2 w - - 0 40", "correct_move_uci": "g3f4", "correct_move_san": null, "puzzle_id": "WIdps", "rating": "1080", "themes": "crushing endgame knightEndgame short", "explanation": "White has to deal with Black's d-pawn, one square from queening with threats. gxf4+ removes the attacking knight with check and defuses it; anything passive here (Kg1, f3) walks straight into a forced mate.", "id": 13, "acceptable_moves_uci": ["g3f4"]}, {"source": "own_blunder", "fen": "3r4/PP1k1ppp/8/8/4p3/3p4/3K3P/R7 b - - 0 40", "correct_move_uci": "e4e3", "correct_move_san": "e3+", "source_game_id": 1458, "ply": 80, "explanation": "White's a7 and b7 pawns are both one step from queening and your king can't stop both at once -- this position was already lost regardless of what gets played here. In the real game, Kc7 was played, which just speeds up the inevitable; even the best try barely changes the outcome.", "id": 14, "acceptable_moves_uci": ["h7h5", "g7g6", "e4e3"]}, {"source": "own_null", "fen": "1k5r/p1p2pp1/1p2p2p/1Rb1P3/P6P/5N2/1PP2PP1/3K4 w - - 1 21", "correct_move_uci": "d1e2", "correct_move_san": "Ke2", "source_game_id": 1463, "ply": 41, "explanation": "King safety shuffle in a roughly balanced position -- Ke2 is marginally best but Ke1 holds just as well. Small stuff, not a tactic.", "id": 15, "acceptable_moves_uci": ["d1e2", "d1e1"]}, {"source": "lichess_puzzle", "fen": "r3rk2/1p1n4/2pNp2b/p3P2p/2PP1P1P/1P5q/P5R1/R1B1KB2 w Q - 7 27", "correct_move_uci": "g2g8", "correct_move_san": null, "puzzle_id": "yDNkG", "rating": "1296", "themes": "advantage discoveredAttack middlegame short", "explanation": "Rg8+ is the rook on g2 moving with check -- which also clears the diagonal for your bishop on f1, so Bxh3 captures Black's queen next move. The check and the discovered line-opening happen in the same move, which is the whole point of the combination.", "id": 16, "acceptable_moves_uci": ["g2g8"]}, {"source": "lichess_puzzle", "fen": "q1k4r/3b4/pBp1n3/N1b1p3/4Q3/8/P5PP/5RK1 w - - 0 36", "correct_move_uci": "b6c5", "correct_move_san": null, "puzzle_id": "bEn6D", "rating": "1306", "themes": "crushing fork long middlegame", "explanation": "Bxc5 trades into a forced sequence (Nxc5 Qxe5 Re8 Qxc5) that nets real material by the end -- not one flashy shot, just the only line here that doesn't hand the initiative to Black's queen on a8 instead.", "id": 17, "acceptable_moves_uci": ["b6c5"]}, {"source": "own_null", "fen": "r1bq1rk1/pp2N1pp/2n5/5p2/3pQ3/5N2/PP1P1PPP/R1B2RK1 b - - 0 13", "correct_move_uci": "c6e7", "correct_move_san": "Nxe7", "source_game_id": 1464, "ply": 26, "explanation": "A white knight is hanging on e7 -- Nxe7 and Qxe7 both just win it back, interchangeably (within 20 points of each other). Not finding the capture at all is the actual mistake, which is why Kh8 drops nearly 200 points by comparison.", "id": 18, "acceptable_moves_uci": ["c6e7", "d8e7"]}, {"source": "own_null", "fen": "8/7p/8/5k2/5p2/5P1b/3N3P/7K b - - 0 44", "correct_move_uci": "f5e5", "correct_move_san": "Ke5", "source_game_id": 1468, "ply": 88, "explanation": "Another dead-drawn minor-piece endgame -- Ke5, Ke6, and h6 are all 0.00. Staying calm and not forcing anything is the whole skill being tested.", "id": 19, "acceptable_moves_uci": ["f5f6", "f5e5", "h7h6", "f5e6", "f5g6", "f5g5"]}];
const DRILL_SECONDS = 8;

let order = [];
let idx = 0;
let selected = null;
let timer = null;
let elapsed = 0; // seconds, counts up, never forces anything
let committed = false;
let results = []; // {source, correct, elapsed}

function shuffledOrder(n) {
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseFen(fen) {
  const [placement, active] = fen.split(" ");
  const rows = placement.split("/");
  const grid = {}; // "e4" -> piece char
  const files = "abcdefgh";
  for (let r = 0; r < 8; r++) {
    let f = 0;
    for (const ch of rows[r]) {
      if (/\d/.test(ch)) { f += parseInt(ch, 10); }
      else { grid[files[f] + (8 - r)] = ch; f += 1; }
    }
  }
  return { grid, active };
}

let currentGrid = null;
let boardOrientation = "w";

function renderGrid(grid) {
  const files = "abcdefgh";
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  const ranks = boardOrientation === "w" ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const fileOrder = boardOrientation === "w" ? files.split("") : files.split("").reverse();
  for (const rank of ranks) {
    for (const file of fileOrder) {
      const sq = file + rank;
      const div = document.createElement("div");
      const isLight = (files.indexOf(file) + rank) % 2 === 1;
      div.className = "sq " + (isLight ? "light" : "dark");
      div.dataset.sq = sq;
      const piece = grid[sq];
      if (piece) {
        div.textContent = PIECE_UNICODE[piece] || "";
        div.classList.add(piece === piece.toUpperCase() ? "piece-white" : "piece-black");
      }
      div.addEventListener("click", onSquareClick);
      boardEl.appendChild(div);
    }
  }
}

function updateTurnIndicator(active) {
  const el = document.getElementById("turnIndicator");
  const label = active === "w" ? "White to move" : "Black to move";
  const dotClass = active === "w" ? "white" : "black";
  el.innerHTML = `<span class="dot ${dotClass}"></span>${label}`;
}

function renderBoard(fen) {
  const { grid, active } = parseFen(fen);
  currentGrid = grid;
  boardOrientation = active; // orient so the side to move is at the bottom
  renderGrid(currentGrid);
  updateTurnIndicator(active);
  return active;
}

// Minimal move applier: enough to correctly show captures, promotion, castling,
// and en passant for the purpose of revealing what the correct move looked like.
function applyMove(grid, uci) {
  const g = Object.assign({}, grid);
  const from = uci.slice(0, 2);
  const to = uci.slice(2, 4);
  const promo = uci.length > 4 ? uci[4] : null;
  let piece = g[from];
  delete g[from];
  if (!piece) return g; // defensive: shouldn't happen with well-formed drill data
  const isPawn = piece.toLowerCase() === "p";
  if (isPawn && from[0] !== to[0] && !grid[to]) {
    // en passant: captured pawn sits on the from-rank, to-file
    delete g[to[0] + from[1]];
  }
  if (promo) {
    piece = piece === piece.toUpperCase() ? promo.toUpperCase() : promo.toLowerCase();
  }
  if (piece.toLowerCase() === "k" && Math.abs(from.charCodeAt(0) - to.charCodeAt(0)) === 2) {
    const rank = from[1];
    if (to[0] === "g") { g["f" + rank] = g["h" + rank]; delete g["h" + rank]; }
    else if (to[0] === "c") { g["d" + rank] = g["a" + rank]; delete g["a" + rank]; }
  }
  g[to] = piece;
  return g;
}

const PIECE_UNICODE = {"P": "\u2659", "N": "\u2658", "B": "\u2657", "R": "\u2656", "Q": "\u2655", "K": "\u2654", "p": "\u265f", "n": "\u265e", "b": "\u265d", "r": "\u265c", "q": "\u265b", "k": "\u265a"};

function onSquareClick(e) {
  if (committed) return;
  const sq = e.currentTarget.dataset.sq;
  if (!selected) {
    if (!e.currentTarget.textContent) return; // clicked an empty square first
    selected = sq;
    e.currentTarget.classList.add("selected");
    return;
  }
  const from = selected;
  const to = sq;
  document.querySelectorAll(".sq.selected").forEach(el => el.classList.remove("selected"));
  selected = null;
  commitMove(from + to);
}

function commitMove(uci) {
  if (committed) return;
  committed = true;
  if (timer) clearInterval(timer);
  const drill = DRILLS[order[idx]];
  const accepted = drill.acceptable_moves_uci || [drill.correct_move_uci];
  const isPrimary = uci === drill.correct_move_uci.slice(0, 4);
  const isRight = isPrimary || accepted.some(m => m.slice(0, 4) === uci);
  renderGrid(applyMove(currentGrid, drill.correct_move_uci));
  showFeedback(isRight, drill, false, isPrimary);
  results.push({ source: drill.source, correct: isRight, elapsed });
}

function skip() {
  if (committed) return;
  committed = true;
  if (timer) clearInterval(timer);
  const drill = DRILLS[order[idx]];
  renderGrid(applyMove(currentGrid, drill.correct_move_uci));
  showFeedback(false, drill, true);
  results.push({ source: drill.source, correct: false, elapsed });
}

function showFeedback(isRight, drill, skipped, isPrimary) {
  const fb = document.getElementById("feedback");
  fb.className = isRight ? "correct" : "wrong";
  const correctSan = drill.correct_move_san ? drill.correct_move_san : drill.correct_move_uci;
  let headline;
  if (skipped) {
    headline = `Skipped. The move was ${correctSan}.`;
  } else if (isPrimary) {
    headline = `Right -- ${correctSan}.`;
  } else if (isRight) {
    headline = `Right -- that works too (within a few points of ${correctSan}, the engine's top pick).`;
  } else {
    headline = `Not quite. The move was ${correctSan}.`;
  }
  const withinTarget = elapsed <= DRILL_SECONDS;
  const timeTag = `<div class="time-tag">${elapsed}s -- ${withinTarget ? "within" : "over"} your ${DRILL_SECONDS}s target</div>`;
  const explanationHtml = drill.explanation
    ? `<div id="explanation">${drill.explanation}</div>`
    : "";
  fb.innerHTML = `<span id="feedbackMove">${headline}</span>${timeTag}${explanationHtml}`;
  document.getElementById("nextBtn").disabled = false;
  document.getElementById("skipBtn").disabled = true;
}

function startStopwatch() {
  elapsed = 0;
  updateClock();
  timer = setInterval(() => {
    elapsed += 1;
    updateClock();
  }, 1000);
}

function updateClock() {
  const el = document.getElementById("clock");
  el.textContent = elapsed;
  el.classList.toggle("over-target", elapsed > DRILL_SECONDS);
}

function loadDrill() {
  committed = false;
  selected = null;
  if (timer) clearInterval(timer);
  document.getElementById("feedback").className = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("skipBtn").disabled = false;
  document.getElementById("targetLabel").textContent = `target ${DRILL_SECONDS}s`;
  document.getElementById("counter").textContent = `Drill ${idx + 1} / ${order.length}`;
  const drill = DRILLS[order[idx]];
  renderBoard(drill.fen);
  startStopwatch();
}

function nextDrill() {
  idx += 1;
  if (idx >= order.length) {
    showSummary();
  } else {
    loadDrill();
  }
}

function showSummary() {
  document.getElementById("quiz").style.display = "none";
  const summary = document.getElementById("summary");
  summary.style.display = "block";
  const bySource = {};
  for (const r of results) {
    bySource[r.source] = bySource[r.source] || { correct: 0, total: 0 };
    bySource[r.source].total += 1;
    if (r.correct) bySource[r.source].correct += 1;
  }
  const labels = { own_blunder: "Your past blunders", own_null: "Your quiet positions", lichess_puzzle: "Puzzle pool" };
  const total = results.length;
  const totalCorrect = results.filter(r => r.correct).length;
  const withinTarget = results.filter(r => r.elapsed <= DRILL_SECONDS).length;
  let rows = `<tr><td><strong>Overall</strong></td><td>${totalCorrect} / ${total}</td></tr>`;
  for (const [src, v] of Object.entries(bySource)) {
    rows += `<tr><td>${labels[src] || src}</td><td>${v.correct} / ${v.total}</td></tr>`;
  }
  rows += `<tr><td>Within ${DRILL_SECONDS}s target</td><td>${withinTarget} / ${total}</td></tr>`;
  document.getElementById("summaryTable").innerHTML = rows;
}

function start() {
  order = shuffledOrder(DRILLS.length);
  idx = 0;
  results = [];
  document.getElementById("quiz").style.display = "block";
  document.getElementById("summary").style.display = "none";
  loadDrill();
}

document.getElementById("skipBtn").addEventListener("click", skip);
document.getElementById("nextBtn").addEventListener("click", nextDrill);
document.getElementById("restartBtn").addEventListener("click", start);
start();
</script>

<!doctype html>
<title>Chess Drills</title>
<style>
:root {
  --bg: #f5f3ee; --panel: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
  --board-light: #eeeed2; --board-dark: #769656; --accent: #3b6ea5;
  --correct: #2e7d32; --wrong: #c0392b; --border: #d8d4cb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --panel: #262626; --text: #ececec; --muted: #9a9a9a;
    --board-light: #b9b9a0; --board-dark: #4d6b3a; --accent: #6ea0d8;
    --correct: #4caf50; --wrong: #e57373; --border: #3a3a3a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1b; --panel: #262626; --text: #ececec; --muted: #9a9a9a;
  --board-light: #b9b9a0; --board-dark: #4d6b3a; --accent: #6ea0d8;
  --correct: #4caf50; --wrong: #e57373; --border: #3a3a3a;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif;
       display: flex; flex-direction: column; align-items: center; padding: 24px 12px; margin: 0; }
h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; text-align: center; max-width: 520px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
         max-width: 640px; width: 100%; }
.status-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
              font-size: 0.85rem; color: var(--muted); }
#turnIndicator { font-weight: 700; font-size: 0.95rem; color: var(--text); display: flex; align-items: center; gap: 6px; }
#turnIndicator .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block;
                       border: 1.5px solid var(--text); }
#turnIndicator .dot.white { background: #f5f5f0; }
#turnIndicator .dot.black { background: #2a2a2a; }
#clock { font-weight: 700; font-size: 1rem; color: var(--text); font-variant-numeric: tabular-nums; }
#clock.low { color: var(--wrong); }
.play-area { display: flex; gap: 16px; align-items: flex-start; }
.board-col { flex: 1; min-width: 0; }
#board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1;
         border: 2px solid var(--border); border-radius: 6px; overflow: hidden; }
.sq { display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 6vw, 40px);
      cursor: pointer; user-select: none; position: relative; aspect-ratio: 1; line-height: 1; }
.sq.light { background: var(--board-light); }
.sq.dark { background: var(--board-dark); }
.sq.selected { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.piece-white { color: #f7f5ef; -webkit-text-stroke: 1.3px #26251f; text-stroke: 1.3px #26251f;
               paint-order: stroke fill; }
.piece-black { color: #1b1a17; -webkit-text-stroke: 0.6px #1b1a17; text-stroke: 0.6px #1b1a17; }
.button-col { display: flex; flex-direction: column; gap: 8px; width: 150px; flex-shrink: 0; }
button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 12px 10px;
         font-size: 0.85rem; cursor: pointer; width: 100%; }
button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
button:disabled { opacity: 0.4; cursor: default; }
#feedback { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
#feedback.correct { background: color-mix(in srgb, var(--correct) 15%, transparent); color: var(--correct); display: block; }
#feedback.wrong { background: color-mix(in srgb, var(--wrong) 15%, transparent); color: var(--wrong); display: block; }
#feedbackMove { font-weight: 600; }
#explanation { margin-top: 8px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
               color: var(--text); font-size: 0.88rem; line-height: 1.45; }
#summary { display: none; text-align: center; }
#summary table { width: 100%; margin: 12px 0; font-size: 0.9rem; }
#summary td { padding: 4px 0; }
#summary td:last-child { text-align: right; font-weight: 600; }
@media (max-width: 560px) {
  .play-area { flex-direction: column; }
  .button-col { flex-direction: row; width: 100%; }
}
</style>

<h1>Chess Drills</h1>
<div class="sub">Commit a move before you see anything. No position tells you whether it's winning, losing, or equal -- that's the point.</div>

<div class="panel">
  <div id="quiz">
    <div class="status-row">
      <span id="counter">Drill 1 / N</span>
      <span id="turnIndicator"></span>
      <span id="clock">8</span>
    </div>
    <div class="play-area">
      <div class="board-col">
        <div id="board"></div>
        <div id="feedback"></div>
      </div>
      <div class="button-col">
        <button class="secondary" id="skipBtn">Don't know / skip</button>
        <button id="nextBtn" disabled>Next drill</button>
      </div>
    </div>
  </div>
  <div id="summary">
    <h2 style="margin:0 0 8px;font-size:1rem;">Session done</h2>
    <table id="summaryTable"></table>
    <button id="restartBtn">Run again</button>
  </div>
</div>

<script>
const DRILLS = [{"source": "own_blunder", "fen": "rr4k1/2p2pp1/2P4p/p2p1b2/3P4/1P2P1P1/P4PP1/2R1KB1R w K - 0 18", "correct_move_uci": "f1e2", "correct_move_san": "Be2", "source_game_id": 1482, "ply": 35, "explanation": "Your king's still stuck on e1 and Black's bishop on f5 eyes the long diagonal toward it. Be2 finishes development and clears the way to castle; you played Rc5 instead, grabbing at the d5 pawn, and your clear edge slipped back to roughly equal.", "id": 0}, {"source": "own_null", "fen": "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", "correct_move_uci": "e2e4", "correct_move_san": "e4", "source_game_id": 1506, "ply": 1, "explanation": "Move one -- e4, d4, and Nf3 all score within a few centipawns of each other here. This is a null drill on purpose: there's no hidden best move, just a principled choice, and recognizing that is as useful as finding a tactic.", "id": 1}, {"source": "lichess_puzzle", "fen": "4kb1r/3n1p2/4p2p/3PP1p1/2Q3PB/2Pp3K/p4P1P/6r1 w k - 0 32", "correct_move_uci": "c4c8", "correct_move_san": null, "puzzle_id": "idNH5", "rating": "1201", "themes": "endgame mate mateIn2 short", "explanation": "Qc8+ forces the king to e7, the only square it has, then d6# delivers mate -- your e5 and d5 pawns already seal off every other escape. When the first move is forcing and leads straight to mate, there's nothing to calculate beyond confirming it's actually forced.", "id": 2}, {"source": "lichess_puzzle", "fen": "3r2k1/8/p4qpp/1pQ5/4Rp1P/1P6/1P3PPK/2Rr4 b - - 0 34", "correct_move_uci": "f6h4", "correct_move_san": null, "puzzle_id": "7TnVd", "rating": "1202", "themes": "endgame mate mateIn1 oneMove", "explanation": "Qxh4 is simply mate -- check from the queen with the king on h2 boxed in by its own pawns and nowhere to run on the g-file. One-movers like this are about noticing the king has no squares before anything else.", "id": 3}, {"source": "own_null", "fen": "r3kb1r/pp1b3p/2p1p1pP/3pP1B1/1qP1p1Q1/4P3/PP3PP1/2KR1B1R w kq - 0 16", "correct_move_uci": "c1b1", "correct_move_san": "Kb1", "source_game_id": 1492, "ply": 31, "explanation": "Your king is still on c1 in the middle of your own attack. Kb1 is pure prophylaxis -- tucking it off any future c-file check before continuing -- and it's essentially interchangeable with Bf6 here (both near +100). Another null drill: several moves work, the point is not blundering, not finding the one right answer.", "id": 4}, {"source": "own_null", "fen": "r2q1rk1/1bp2ppp/1pnbp3/p2pn3/3P1P1P/2PBP1B1/PP1N2P1/R2QK2R w KQ - 0 12", "correct_move_uci": "f4e5", "correct_move_san": "fxe5", "source_game_id": 1462, "ply": 23, "explanation": "Black's knight on e5 is just hanging to your f-pawn. fxe5 recaptures toward the center and keeps your bishop pair active; dxe5 also wins the piece but surrenders more central control for no reason. Straightforward material math, not a hidden idea.", "id": 5}, {"source": "own_blunder", "fen": "8/8/8/8/2b2N2/5P1p/5K1k/8 b - - 0 54", "correct_move_uci": "c4f7", "correct_move_san": "Bf7", "source_game_id": 1468, "ply": 108, "explanation": "White's knight on f4 already covers d5 -- Bg8 sidesteps it and keeps the position roughly balanced. You played Bd5 straight into the attack, and Nxd5 just won the piece outright. In king-and-minor endgames like this, the first question before any bishop move is always what the knight can already reach.", "id": 6}, {"source": "own_blunder", "fen": "7r/4Qpkp/4pnp1/4Bq2/8/5P2/PP3P1P/4R2K w - - 4 30", "correct_move_uci": "h1g2", "correct_move_san": "Kg2", "source_game_id": 1475, "ply": 59, "explanation": "Black's queen and knight are lined up for ...Qxf3+, and your king on h1 has no good answer once it lands. Kg2 reinforces f3 and sidesteps the whole idea; you played b4 instead, ignoring it, and ...Qxf3+ followed by ...Qg4+ cost you the pawn and the initiative.", "id": 7}, {"source": "own_null", "fen": "8/2k5/2p5/3b4/1B1K4/8/8/8 b - - 11 52", "correct_move_uci": "c7b7", "correct_move_san": "Kb7", "source_game_id": 1459, "ply": 104, "explanation": "A dead-drawn bishop endgame -- Kb7, Bf3, and Be6 are all 0.00 here, there's genuinely nothing to find. These positions are in the drill set on purpose: real games have long stretches where the right answer is just not losing.", "id": 8}, {"source": "lichess_puzzle", "fen": "2r4k/4q2p/1b3p2/1p2p2Q/1P1nP2N/2r3P1/R4P1P/4R1K1 w - - 6 36", "correct_move_uci": "h4g6", "correct_move_san": null, "puzzle_id": "wSwUS", "rating": "1021", "themes": "crushing kingsideAttack middlegame pin short", "explanation": "Ng6+ forks the king and queen at once -- check forces Kg7, then Nxe7 just takes the queen. Both alternatives (Ra6, Ra8) ignore the fork and let Black's attack down the c-file take over instead.", "id": 9}, {"source": "own_blunder", "fen": "r1bk2nr/pppp2Qp/2n2p2/1q2P3/8/8/2PNPPPP/3RKB1R w K - 0 14", "correct_move_uci": "g7f8", "correct_move_san": "Qf8#", "source_game_id": 1501, "ply": 27, "explanation": "Qf8# is mate in one -- your queen and the e5 pawn have Black's king boxed in completely. You played Qxh8 instead, grabbing the rook, and the game went on for another 30-odd moves before you actually delivered mate. You were so far ahead it barely cost the result this time, but a missed mate-in-one is the clearest version of the same pattern as the slower conversions: there was a cleaner finish available and it wasn't taken.", "id": 10}, {"source": "own_blunder", "fen": "k7/1p4pp/p5n1/q2N4/1PP2p1b/P2R3P/3K3P/5R2 b - - 0 35", "correct_move_uci": "a5d8", "correct_move_san": "Qd8", "source_game_id": 1472, "ply": 70, "explanation": "Your queen on a5 and king on a8 share a knight-fork relationship with White's knight on d5 -- any queen move that stays reachable by Nb6+ loses it. Qd8 steps out of the fork entirely; you played Qa4 instead, right back into Nb6+ forking king and queen, and the queen was gone.", "id": 11}, {"source": "own_null", "fen": "7n/7k/8/5K2/1p4P1/1P6/8/8 b - - 1 66", "correct_move_uci": "h8g6", "correct_move_san": "Ng6", "source_game_id": 1464, "ply": 132, "explanation": "Another drawn-out knight endgame where Ng6, Nf7, and Kg7 are all within 2 centipawns of each other. The lesson here isn't a move, it's recognizing when a position genuinely doesn't have a sharp answer.", "id": 12}, {"source": "own_null", "fen": "r2qk2r/pp2bppp/2n5/3p4/8/1BPPPQ1P/PP4P1/R4RK1 b kq - 0 14", "correct_move_uci": "e8g8", "correct_move_san": "O-O", "source_game_id": 1465, "ply": 28, "explanation": "O-O gets your king to safety while you're still ahead (+220); Ne5 and Bf6 both keep a similar edge by staying active in the center instead. All three are reasonable -- the one thing that would actually cost the advantage is leaving the king in the middle too long, not which of these three you pick.", "id": 13}, {"source": "own_blunder", "fen": "2kr1br1/pp1b2Bp/2p1p1pP/3pP3/1qP1p1Q1/4P3/PP3PP1/2KR1B1R w - - 4 18", "correct_move_uci": "g7f6", "correct_move_san": "Bf6", "source_game_id": 1492, "ply": 35, "explanation": "Bf6 keeps the attack going without committing to a trade; you played Bxf8 instead, and the recapture ...Rgxf8 handed back the bishop pair and the initiative for not much -- the eval went from a small White edge to a real Black one. Not every capture that's available is the move that keeps your advantage.", "id": 14}, {"source": "own_null", "fen": "8/8/8/5k1p/5p2/5P1b/3N3P/6K1 b - - 1 45", "correct_move_uci": "f5e5", "correct_move_san": "Ke5", "source_game_id": 1468, "ply": 90, "explanation": "A balanced minor-piece endgame -- Ke5, Ke6, and Kf6 all hold at dead equal. Same idea as the other null positions: staying calm and not forcing anything is the actual skill being tested.", "id": 15}, {"source": "lichess_puzzle", "fen": "r2qkb1r/pp2pppp/2n2n2/1B3b2/3p4/3P2Q1/PPP1NPPP/R1B1K1NR b KQkq - 1 8", "correct_move_uci": "d8a5", "correct_move_san": null, "puzzle_id": "1PAD7", "rating": "1345", "themes": "crushing fork opening short", "explanation": "Qa5+ forks the king on e1 and the bishop on b5 with one move -- the check buys the tempo to pick up the piece next with Qxb5. An early reminder that checks are worth scanning for even in the opening, not just the middlegame.", "id": 16}, {"source": "own_blunder", "fen": "r2q1rk1/ppp2pbp/5np1/8/3nPBb1/2NB1N2/PPP2QPP/1K1R3R b - - 0 13", "correct_move_uci": "d4e6", "correct_move_san": "Ne6", "source_game_id": 1498, "ply": 26, "explanation": "Your knight on d4 is only defended by the bishop on g4, and White's queen can simply take it -- Ne6 gets it to safety first. You played c6 instead, a pawn move that doesn't address the hanging knight at all, and Qxd4 just won it.", "id": 17}, {"source": "lichess_puzzle", "fen": "6k1/1p3p1p/3Q4/3qP3/1p1p2P1/1P2nP1K/P2R3P/8 b - - 4 45", "correct_move_uci": "d5f3", "correct_move_san": null, "puzzle_id": "mZ2ev", "rating": "1356", "themes": "endgame mate mateIn2 short", "explanation": "Qxf3+ forces the king to h4 -- nothing else is legal -- then Qxg4 is mate, the king runs out of squares two moves after the check lands. Same pattern as the other mate puzzles here: find the only check, confirm where the king's forced, then see if that square is actually fatal.", "id": 18}, {"source": "own_blunder", "fen": "1k2r2r/pp5p/2nq1pp1/2Np1n2/P2P1NQ1/2P5/1P3PPP/R4RK1 b - - 0 20", "correct_move_uci": "h7h5", "correct_move_san": "h5", "source_game_id": 1476, "ply": 40, "explanation": "h5 was the simple prophylactic move, keeping White's queen off g4 and h5 and your position intact. You played Nh6 instead, moving the knight to a passive square, and Qd7 walked straight into your position -- the trade that followed (Qxd7 Nxd7+) cost real ground.", "id": 19}];
const DRILL_SECONDS = 8;

let order = [];
let idx = 0;
let selected = null;
let timer = null;
let timeLeft = DRILL_SECONDS;
let committed = false;
let results = []; // {source, correct}

function shuffledOrder(n) {
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseFen(fen) {
  const [placement, active] = fen.split(" ");
  const rows = placement.split("/");
  const grid = {}; // "e4" -> piece char
  const files = "abcdefgh";
  for (let r = 0; r < 8; r++) {
    let f = 0;
    for (const ch of rows[r]) {
      if (/\d/.test(ch)) { f += parseInt(ch, 10); }
      else { grid[files[f] + (8 - r)] = ch; f += 1; }
    }
  }
  return { grid, active };
}

let currentGrid = null;
let boardOrientation = "w";

function renderGrid(grid) {
  const files = "abcdefgh";
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  const ranks = boardOrientation === "w" ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const fileOrder = boardOrientation === "w" ? files.split("") : files.split("").reverse();
  for (const rank of ranks) {
    for (const file of fileOrder) {
      const sq = file + rank;
      const div = document.createElement("div");
      const isLight = (files.indexOf(file) + rank) % 2 === 1;
      div.className = "sq " + (isLight ? "light" : "dark");
      div.dataset.sq = sq;
      const piece = grid[sq];
      if (piece) {
        div.textContent = PIECE_UNICODE[piece] || "";
        div.classList.add(piece === piece.toUpperCase() ? "piece-white" : "piece-black");
      }
      div.addEventListener("click", onSquareClick);
      boardEl.appendChild(div);
    }
  }
}

function updateTurnIndicator(active) {
  const el = document.getElementById("turnIndicator");
  const label = active === "w" ? "White to move" : "Black to move";
  const dotClass = active === "w" ? "white" : "black";
  el.innerHTML = `<span class="dot ${dotClass}"></span>${label}`;
}

function renderBoard(fen) {
  const { grid, active } = parseFen(fen);
  currentGrid = grid;
  boardOrientation = active; // orient so the side to move is at the bottom
  renderGrid(currentGrid);
  updateTurnIndicator(active);
  return active;
}

// Minimal move applier: enough to correctly show captures, promotion, castling,
// and en passant for the purpose of revealing what the correct move looked like.
function applyMove(grid, uci) {
  const g = Object.assign({}, grid);
  const from = uci.slice(0, 2);
  const to = uci.slice(2, 4);
  const promo = uci.length > 4 ? uci[4] : null;
  let piece = g[from];
  delete g[from];
  if (!piece) return g; // defensive: shouldn't happen with well-formed drill data
  const isPawn = piece.toLowerCase() === "p";
  if (isPawn && from[0] !== to[0] && !grid[to]) {
    // en passant: captured pawn sits on the from-rank, to-file
    delete g[to[0] + from[1]];
  }
  if (promo) {
    piece = piece === piece.toUpperCase() ? promo.toUpperCase() : promo.toLowerCase();
  }
  if (piece.toLowerCase() === "k" && Math.abs(from.charCodeAt(0) - to.charCodeAt(0)) === 2) {
    const rank = from[1];
    if (to[0] === "g") { g["f" + rank] = g["h" + rank]; delete g["h" + rank]; }
    else if (to[0] === "c") { g["d" + rank] = g["a" + rank]; delete g["a" + rank]; }
  }
  g[to] = piece;
  return g;
}

const PIECE_UNICODE = {"P": "\u2659", "N": "\u2658", "B": "\u2657", "R": "\u2656", "Q": "\u2655", "K": "\u2654", "p": "\u265f", "n": "\u265e", "b": "\u265d", "r": "\u265c", "q": "\u265b", "k": "\u265a"};

function onSquareClick(e) {
  if (committed) return;
  const sq = e.currentTarget.dataset.sq;
  if (!selected) {
    if (!e.currentTarget.textContent) return; // clicked an empty square first
    selected = sq;
    e.currentTarget.classList.add("selected");
    return;
  }
  const from = selected;
  const to = sq;
  document.querySelectorAll(".sq.selected").forEach(el => el.classList.remove("selected"));
  selected = null;
  commitMove(from + to);
}

function commitMove(uci) {
  if (committed) return;
  committed = true;
  clearInterval(timer);
  const drill = DRILLS[order[idx]];
  const correct = drill.correct_move_uci.slice(0, 4);
  const isRight = uci === correct;
  renderGrid(applyMove(currentGrid, drill.correct_move_uci));
  showFeedback(isRight, drill);
  results.push({ source: drill.source, correct: isRight });
}

function skip() {
  if (committed) return;
  committed = true;
  clearInterval(timer);
  const drill = DRILLS[order[idx]];
  renderGrid(applyMove(currentGrid, drill.correct_move_uci));
  showFeedback(false, drill, true);
  results.push({ source: drill.source, correct: false });
}

function showFeedback(isRight, drill, skipped) {
  const fb = document.getElementById("feedback");
  fb.className = isRight ? "correct" : "wrong";
  const correctSan = drill.correct_move_san ? drill.correct_move_san : drill.correct_move_uci;
  const headline = skipped
    ? `Skipped. The move was ${correctSan}.`
    : (isRight ? `Right -- ${correctSan}.` : `Not quite. The move was ${correctSan}.`);
  const explanationHtml = drill.explanation
    ? `<div id="explanation">${drill.explanation}</div>`
    : "";
  fb.innerHTML = `<span id="feedbackMove">${headline}</span>${explanationHtml}`;
  document.getElementById("nextBtn").disabled = false;
}

function startTimer() {
  timeLeft = DRILL_SECONDS;
  updateClock();
  timer = setInterval(() => {
    timeLeft -= 1;
    updateClock();
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (!committed) skip();
    }
  }, 1000);
}

function updateClock() {
  const el = document.getElementById("clock");
  el.textContent = timeLeft;
  el.classList.toggle("low", timeLeft <= 3);
}

function loadDrill() {
  committed = false;
  selected = null;
  document.getElementById("feedback").className = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("counter").textContent = `Drill ${idx + 1} / ${order.length}`;
  const drill = DRILLS[order[idx]];
  renderBoard(drill.fen);
  startTimer();
}

function nextDrill() {
  idx += 1;
  if (idx >= order.length) {
    showSummary();
  } else {
    loadDrill();
  }
}

function showSummary() {
  document.getElementById("quiz").style.display = "none";
  const summary = document.getElementById("summary");
  summary.style.display = "block";
  const bySource = {};
  for (const r of results) {
    bySource[r.source] = bySource[r.source] || { correct: 0, total: 0 };
    bySource[r.source].total += 1;
    if (r.correct) bySource[r.source].correct += 1;
  }
  const labels = { own_blunder: "Your past blunders", own_null: "Your quiet positions", lichess_puzzle: "Puzzle pool" };
  const total = results.length;
  const totalCorrect = results.filter(r => r.correct).length;
  let rows = `<tr><td><strong>Overall</strong></td><td>${totalCorrect} / ${total}</td></tr>`;
  for (const [src, v] of Object.entries(bySource)) {
    rows += `<tr><td>${labels[src] || src}</td><td>${v.correct} / ${v.total}</td></tr>`;
  }
  document.getElementById("summaryTable").innerHTML = rows;
}

function start() {
  order = shuffledOrder(DRILLS.length);
  idx = 0;
  results = [];
  document.getElementById("quiz").style.display = "block";
  document.getElementById("summary").style.display = "none";
  loadDrill();
}

document.getElementById("skipBtn").addEventListener("click", skip);
document.getElementById("nextBtn").addEventListener("click", nextDrill);
document.getElementById("restartBtn").addEventListener("click", start);
start();
</script>

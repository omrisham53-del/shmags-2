<!doctype html>
<title>Chess Drills</title>
<style>
:root {
  --bg: #f5f3ee; --panel: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
  --board-light: #eeeed2; --board-dark: #769656; --accent: #3b6ea5;
  --correct: #2e7d32; --wrong: #c0392b; --border: #d8d4cb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --panel: #262626; --text: #ececec; --muted: #9a9a9a;
    --board-light: #b9b9a0; --board-dark: #4d6b3a; --accent: #6ea0d8;
    --correct: #4caf50; --wrong: #e57373; --border: #3a3a3a;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1b; --panel: #262626; --text: #ececec; --muted: #9a9a9a;
  --board-light: #b9b9a0; --board-dark: #4d6b3a; --accent: #6ea0d8;
  --correct: #4caf50; --wrong: #e57373; --border: #3a3a3a;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif;
       display: flex; flex-direction: column; align-items: center; padding: 24px 12px; margin: 0; }
h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; text-align: center; max-width: 520px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
         max-width: 640px; width: 100%; }
.status-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
              font-size: 0.85rem; color: var(--muted); }
#turnIndicator { font-weight: 700; font-size: 0.95rem; color: var(--text); display: flex; align-items: center; gap: 6px; }
#turnIndicator .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block;
                       border: 1.5px solid var(--text); }
#turnIndicator .dot.white { background: #f5f5f0; }
#turnIndicator .dot.black { background: #2a2a2a; }
.stopwatch { display: flex; align-items: baseline; gap: 5px; }
#clock { font-weight: 700; font-size: 1rem; color: var(--text); font-variant-numeric: tabular-nums; }
#clock.over-target { color: var(--wrong); }
#targetLabel { font-size: 0.78rem; color: var(--muted); }
.time-tag { font-size: 0.82rem; margin-top: 2px; opacity: 0.85; }
.play-area { display: flex; gap: 16px; align-items: flex-start; }
.board-col { flex: 1; min-width: 0; }
#board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1;
         border: 2px solid var(--border); border-radius: 6px; overflow: hidden; }
.sq { display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 6vw, 40px);
      cursor: pointer; user-select: none; position: relative; aspect-ratio: 1; line-height: 1; }
.sq.light { background: var(--board-light); }
.sq.dark { background: var(--board-dark); }
.sq.selected { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.piece-white { color: #f7f5ef; -webkit-text-stroke: 1.3px #26251f; text-stroke: 1.3px #26251f;
               paint-order: stroke fill; }
.piece-black { color: #1b1a17; -webkit-text-stroke: 0.6px #1b1a17; text-stroke: 0.6px #1b1a17; }
.button-col { display: flex; flex-direction: column; gap: 8px; width: 150px; flex-shrink: 0; }
button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 12px 10px;
         font-size: 0.85rem; cursor: pointer; width: 100%; }
button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
button:disabled { opacity: 0.4; cursor: default; }
#feedback { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
#feedback.correct { background: color-mix(in srgb, var(--correct) 15%, transparent); color: var(--correct); display: block; }
#feedback.wrong { background: color-mix(in srgb, var(--wrong) 15%, transparent); color: var(--wrong); display: block; }
#feedbackMove { font-weight: 600; }
#explanation { margin-top: 8px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
               color: var(--text); font-size: 0.88rem; line-height: 1.45; }
#summary { display: none; text-align: center; }
#summary table { width: 100%; margin: 12px 0; font-size: 0.9rem; }
#summary td { padding: 4px 0; }
#summary td:last-child { text-align: right; font-weight: 600; }
@media (max-width: 560px) {
  .play-area { flex-direction: column; }
  .button-col { flex-direction: row; width: 100%; }
}
</style>

<h1>Chess Drills</h1>
<div class="sub">Commit a move before you see anything. No position tells you whether it's winning, losing, or equal -- that's the point.</div>

<div class="panel">
  <div id="quiz">
    <div class="status-row">
      <span id="counter">Drill 1 / N</span>
      <span id="turnIndicator"></span>
      <span class="stopwatch"><span id="clock">0</span><span id="targetLabel"></span></span>
    </div>
    <div class="play-area">
      <div class="board-col">
        <div id="board"></div>
        <div id="feedback"></div>
      </div>
      <div class="button-col">
        <button class="secondary" id="skipBtn">Don't know / skip</button>
        <button id="nextBtn" disabled>Next drill</button>
      </div>
    </div>
  </div>
  <div id="summary">
    <h2 style="margin:0 0 8px;font-size:1rem;">Session done</h2>
    <table id="summaryTable"></table>
    <button id="restartBtn">Run again</button>
  </div>
</div>

<script>
const DRILLS = [{"source": "own_null", "fen": "r2q1rk1/6pp/p1pbpp2/3p1n2/3P2b1/P1NQB2P/1PPN1PP1/R4RK1 b - - 0 14", "correct_move_uci": "g4h5", "correct_move_san": "Bh5", "source_game_id": 1507, "ply": 28, "explanation": "Bh5 retreats the attacked bishop and keeps a real edge (-157, good for Black). Bxh3 looks tempting -- grabbing a pawn on the way out -- but gxh3 just wins the bishop back for nothing, swinging the whole thing to +42.", "id": 0, "acceptable_moves_uci": ["g4h5"]}, {"source": "lichess_puzzle", "fen": "4R3/5Q1p/2q4k/6p1/8/8/PPr2nPP/4R1K1 b - - 0 25", "correct_move_uci": "f2h3", "correct_move_san": null, "puzzle_id": "8zIyd", "rating": "1164", "themes": "endgame mate mateIn2 sacrifice short", "explanation": "Nh3+ forces gxh3, the only way to deal with the check, then Qg2 is mate -- the king has nowhere left to go. A classic knight-sac-to-clear-the-mating-square pattern.", "id": 1, "acceptable_moves_uci": ["f2h3"]}, {"source": "own_null", "fen": "r2qkbnr/1p3ppp/p1B1p3/3p4/3P2b1/P1N2N2/1PP2PPP/R1BQK2R b KQkq - 0 8", "correct_move_uci": "b7c6", "correct_move_san": "bxc6", "source_game_id": 1507, "ply": 16, "explanation": "bxc6 removes the bishop that just gave check and holds things close to level (-25). Blocking the check any other way lets White's bishop escape with real material -- Ke7 drops a rook to Bxb7, and Qd7 is even worse after Bxd7+.", "id": 2, "acceptable_moves_uci": ["b7c6"]}, {"source": "own_blunder", "fen": "1k3b2/1pp2pr1/p2r4/3q3p/3PB3/3QP1P1/5P1P/R4RK1 b - - 1 30", "correct_move_uci": "d5b5", "correct_move_san": "Qb5", "source_game_id": 1509, "ply": 60, "explanation": "Qb5 keeps fighting and limits the damage to +151 for White. In the real game, Qg5 was played instead -- chasing the kingside attack while the queenside stayed undefended -- and the position jumped to +490 once White's pieces got loose there.", "id": 3, "acceptable_moves_uci": ["d5b5"]}, {"source": "own_null", "fen": "r2q1rk1/6pp/p1pbpp2/3p4/3P2Pn/P1NQBP2/1PPN4/R4RK1 b - - 0 17", "correct_move_uci": "f6f5", "correct_move_san": "f5", "source_game_id": 1507, "ply": 34, "explanation": "f5 is a normal space-gaining push here (+61) -- Ng6 or h6 score about the same, so this is just sound development, not a position with one precise answer.", "id": 4, "acceptable_moves_uci": ["f6f5"]}, {"source": "own_blunder", "fen": "1k3b2/1pp2prp/p4Q2/1q1r1p2/3Pp3/1P2P1PB/5P1P/R4RK1 b - - 4 25", "correct_move_uci": "b5d7", "correct_move_san": "Qd7", "source_game_id": 1509, "ply": 50, "explanation": "Qd7 holds a genuine edge for Black (-105, winning). In the real game, Qxb3 was played instead -- grabbing a pawn -- which let White's bishop take the hanging f5 pawn next and swung the game to +247, the start of the real collapse.", "id": 5, "acceptable_moves_uci": ["b5d7"]}, {"source": "own_blunder", "fen": "Q2k1b1r/p3pppp/8/q1P5/5Bb1/2n1PN2/PPP2PPP/R3K2R b KQ - 0 11", "correct_move_uci": "g4c8", "correct_move_san": "Bc8", "source_game_id": 1486, "ply": 22, "explanation": "Bc8 drops the loose bishop back to block the queen's path down the 8th rank, holding things to a bad-but-fighting +656. In the real game, Kd7 was played instead, walking the king straight into Ne5+ and a forced march that made it +937.", "id": 6, "acceptable_moves_uci": ["g4c8"]}, {"source": "lichess_puzzle", "fen": "8/p7/3krR2/4n1P1/8/1P1pB3/P4K2/8 b - - 2 54", "correct_move_uci": "e5g4", "correct_move_san": null, "puzzle_id": "Aw5wb", "rating": "1061", "themes": "advantage endgame fork master short", "explanation": "Ng4+ forks the king and the bishop on e3 in one move -- check first, then the bishop's gone next. Rxf6+ looks tempting too but it's dramatically weaker (+2 instead of +252) since it gives up the fork for a much smaller gain.", "id": 7, "acceptable_moves_uci": ["e5g4"]}, {"source": "own_blunder", "fen": "6k1/8/1p1N4/3b3p/R5PP/8/1P2n1PK/5r2 b - - 2 35", "correct_move_uci": "b6b5", "correct_move_san": "b5", "source_game_id": 1464, "ply": 70, "explanation": "b5 hits the rook on a4 and gives Black real chances (-448). In the real game, hxg4 was played instead -- grabbing a pawn -- and the position dropped to -62, giving back almost all of the advantage.", "id": 8, "acceptable_moves_uci": ["b6b5"]}, {"source": "own_null", "fen": "r1b2rk1/p4ppp/1bp1n2n/1p2P3/4N3/1B2PN2/PPP3PP/R1B2RK1 w - - 6 13", "correct_move_uci": "a2a4", "correct_move_san": "a4", "source_game_id": 1508, "ply": 25, "explanation": "a4 just continues normal queenside expansion (+124) -- h3 or Bd2 score about the same here. Nothing sharp is happening in this position, consistent with this being the one game this session with no real mistakes anywhere in it.", "id": 9, "acceptable_moves_uci": ["a2a4", "h2h3", "c1d2", "f1e1"]}, {"source": "own_blunder", "fen": "2rq1rk1/6pp/pp1b4/8/P1p5/4N3/2P1Q1PP/R2R2K1 b - - 0 32", "correct_move_uci": "d8e7", "correct_move_san": "Qe7", "source_game_id": 1450, "ply": 64, "explanation": "Qe7 keeps the full advantage (+455), eyeing ...Bc5 next. In the real game this position is drawn from, Qc7 was played instead, giving back a big chunk of the edge (+196) for no real reason.", "id": 10, "acceptable_moves_uci": ["d8e7"]}, {"source": "own_blunder", "fen": "3R4/kp4pp/p4b2/1n6/NP2R3/3K3P/7P/8 b - - 4 42", "correct_move_uci": "f6d8", "correct_move_san": "Bxd8", "source_game_id": 1472, "ply": 84, "explanation": "Bxd8 simply takes the rook that's sitting there for free, holding the position to +248 instead of letting White's attack run unopposed. In the real game, Nc7 was played instead, missing the free rook entirely and letting it climb to +762.", "id": 11, "acceptable_moves_uci": ["f6d8"]}, {"source": "own_blunder", "fen": "1k3b2/1pp2pr1/p2r4/6qp/3PB3/3QP1P1/5P1P/1R3RK1 b - - 3 31", "correct_move_uci": "d6b6", "correct_move_san": "Rb6", "source_game_id": 1509, "ply": 62, "explanation": "Rb6 defends the a6 pawn with the rook and keeps White's edge to a fighting +164. In the real game, b6 was played instead -- pushing the pawn rather than defending it with the rook -- and Qxa6 crashed through immediately after, the single costliest moment of the whole game at +924.", "id": 12, "acceptable_moves_uci": ["d6b6"]}, {"source": "lichess_puzzle", "fen": "8/7N/4p3/4kp2/1p3n2/6P1/PP1p1P2/5K2 w - - 0 40", "correct_move_uci": "g3f4", "correct_move_san": null, "puzzle_id": "WIdps", "rating": "1080", "themes": "crushing endgame knightEndgame short", "explanation": "White has to deal with Black's d-pawn, one square from queening with threats. gxf4+ removes the attacking knight with check and defuses it; anything passive here (Kg1, f3) walks straight into a forced mate.", "id": 13, "acceptable_moves_uci": ["g3f4"]}, {"source": "own_blunder", "fen": "r2q1rk1/6pp/p1pbpp2/3p1n1b/3P2P1/P1NQB2P/1PPN1P2/R4RK1 b - - 0 15", "correct_move_uci": "f5e3", "correct_move_san": "Nxe3", "source_game_id": 1507, "ply": 30, "explanation": "Nxe3 saves the attacked knight by counter-attacking the bishop, keeping a real edge (-195, good for Black). In the real game, Bxg4 was played instead, grabbing a pawn but leaving the knight on f5 to be captured next -- a piece given up for nothing, though the game was won anyway.", "id": 14, "acceptable_moves_uci": ["f5e3"]}, {"source": "own_null", "fen": "r3k2r/pppq1p1p/4b3/5p2/1b1Pp3/2N1P1P1/PP3PBP/R2Q1RK1 b kq - 0 13", "correct_move_uci": "e8c8", "correct_move_san": "O-O-O", "source_game_id": 1509, "ply": 26, "explanation": "O-O-O tucks the king away and keeps things close to balanced (+59). Bc4 or c6 here would have scored about the same -- safety mattered more than finding one exact move.", "id": 15, "acceptable_moves_uci": ["e8c8", "e6c4", "c7c6", "h7h5", "b4c3"]}, {"source": "lichess_puzzle", "fen": "r3rk2/1p1n4/2pNp2b/p3P2p/2PP1P1P/1P5q/P5R1/R1B1KB2 w Q - 7 27", "correct_move_uci": "g2g8", "correct_move_san": null, "puzzle_id": "yDNkG", "rating": "1296", "themes": "advantage discoveredAttack middlegame short", "explanation": "Rg8+ is the rook on g2 moving with check -- which also clears the diagonal for your bishop on f1, so Bxh3 captures Black's queen next move. The check and the discovered line-opening happen in the same move, which is the whole point of the combination.", "id": 16, "acceptable_moves_uci": ["g2g8"]}, {"source": "lichess_puzzle", "fen": "q1k4r/3b4/pBp1n3/N1b1p3/4Q3/8/P5PP/5RK1 w - - 0 36", "correct_move_uci": "b6c5", "correct_move_san": null, "puzzle_id": "bEn6D", "rating": "1306", "themes": "crushing fork long middlegame", "explanation": "Bxc5 trades into a forced sequence (Nxc5 Qxe5 Re8 Qxc5) that nets real material by the end -- not one flashy shot, just the only line here that doesn't hand the initiative to Black's queen on a8 instead.", "id": 17, "acceptable_moves_uci": ["b6c5"]}, {"source": "own_null", "fen": "r1bqkbnr/pp2pppp/2n5/3p4/3P4/2N2N2/PPP2PPP/R1BQKB1R b KQkq - 3 5", "correct_move_uci": "c8g4", "correct_move_san": "Bg4", "source_game_id": 1507, "ply": 10, "explanation": "Bg4 develops naturally into a dead-equal position (+7) -- a6 or Bf5 score within a few centipawns of the same thing. Standard opening development, nothing to find here.", "id": 18, "acceptable_moves_uci": ["c8g4", "a7a6", "g8f6", "c8f5", "e7e6", "g7g6"]}, {"source": "own_null", "fen": "1k1r4/1pp2prp/p7/1q3p1Q/1b1Pp3/1P2P1PB/5P1P/R4RK1 b - - 0 23", "correct_move_uci": "d8d5", "correct_move_san": "Rd5", "source_game_id": 1509, "ply": 46, "explanation": "Rd5 keeps a real edge here (-108, good for Black) in a game that was still under control at this point -- the actual collapse came two moves later.", "id": 19, "acceptable_moves_uci": ["d8d5"]}];
const DRILL_SECONDS = 8;

let order = [];
let idx = 0;
let selected = null;
let timer = null;
let elapsed = 0; // seconds, counts up, never forces anything
let committed = false;
let results = []; // {source, correct, elapsed}

function shuffledOrder(n) {
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseFen(fen) {
  const [placement, active] = fen.split(" ");
  const rows = placement.split("/");
  const grid = {}; // "e4" -> piece char
  const files = "abcdefgh";
  for (let r = 0; r < 8; r++) {
    let f = 0;
    for (const ch of rows[r]) {
      if (/\d/.test(ch)) { f += parseInt(ch, 10); }
      else { grid[files[f] + (8 - r)] = ch; f += 1; }
    }
  }
  return { grid, active };
}

let currentGrid = null;
let boardOrientation = "w";

function renderGrid(grid) {
  const files = "abcdefgh";
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  const ranks = boardOrientation === "w" ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const fileOrder = boardOrientation === "w" ? files.split("") : files.split("").reverse();
  for (const rank of ranks) {
    for (const file of fileOrder) {
      const sq = file + rank;
      const div = document.createElement("div");
      const isLight = (files.indexOf(file) + rank) % 2 === 1;
      div.className = "sq " + (isLight ? "light" : "dark");
      div.dataset.sq = sq;
      const piece = grid[sq];
      if (piece) {
        div.textContent = PIECE_UNICODE[piece] || "";
        div.classList.add(piece === piece.toUpperCase() ? "piece-white" : "piece-black");
      }
      div.addEventListener("click", onSquareClick);
      boardEl.appendChild(div);
    }
  }
}

function updateTurnIndicator(active) {
  const el = document.getElementById("turnIndicator");
  const label = active === "w" ? "White to move" : "Black to move";
  const dotClass = active === "w" ? "white" : "black";
  el.innerHTML = `<span class="dot ${dotClass}"></span>${label}`;
}

function renderBoard(fen) {
  const { grid, active } = parseFen(fen);
  currentGrid = grid;
  boardOrientation = active; // orient so the side to move is at the bottom
  renderGrid(currentGrid);
  updateTurnIndicator(active);
  return active;
}

// Minimal move applier: enough to correctly show captures, promotion, castling,
// and en passant for the purpose of revealing what the correct move looked like.
function applyMove(grid, uci) {
  const g = Object.assign({}, grid);
  const from = uci.slice(0, 2);
  const to = uci.slice(2, 4);
  const promo = uci.length > 4 ? uci[4] : null;
  let piece = g[from];
  delete g[from];
  if (!piece) return g; // defensive: shouldn't happen with well-formed drill data
  const isPawn = piece.toLowerCase() === "p";
  if (isPawn && from[0] !== to[0] && !grid[to]) {
    // en passant: captured pawn sits on the from-rank, to-file
    delete g[to[0] + from[1]];
  }
  if (promo) {
    piece = piece === piece.toUpperCase() ? promo.toUpperCase() : promo.toLowerCase();
  }
  if (piece.toLowerCase() === "k" && Math.abs(from.charCodeAt(0) - to.charCodeAt(0)) === 2) {
    const rank = from[1];
    if (to[0] === "g") { g["f" + rank] = g["h" + rank]; delete g["h" + rank]; }
    else if (to[0] === "c") { g["d" + rank] = g["a" + rank]; delete g["a" + rank]; }
  }
  g[to] = piece;
  return g;
}

const PIECE_UNICODE = {"P": "\u2659", "N": "\u2658", "B": "\u2657", "R": "\u2656", "Q": "\u2655", "K": "\u2654", "p": "\u265f", "n": "\u265e", "b": "\u265d", "r": "\u265c", "q": "\u265b", "k": "\u265a"};

function onSquareClick(e) {
  if (committed) return;
  const sq = e.currentTarget.dataset.sq;
  if (!selected) {
    if (!e.currentTarget.textContent) return; // clicked an empty square first
    selected = sq;
    e.currentTarget.classList.add("selected");
    return;
  }
  const from = selected;
  const to = sq;
  document.querySelectorAll(".sq.selected").forEach(el => el.classList.remove("selected"));
  selected = null;
  commitMove(from + to);
}

function commitMove(uci) {
  if (committed) return;
  committed = true;
  if (timer) clearInterval(timer);
  const drill = DRILLS[order[idx]];
  const accepted = drill.acceptable_moves_uci || [drill.correct_move_uci];
  const isPrimary = uci === drill.correct_move_uci.slice(0, 4);
  const isRight = isPrimary || accepted.some(m => m.slice(0, 4) === uci);
  renderGrid(applyMove(currentGrid, drill.correct_move_uci));
  showFeedback(isRight, drill, false, isPrimary);
  results.push({ source: drill.source, correct: isRight, elapsed });
}

function skip() {
  if (committed) return;
  committed = true;
  if (timer) clearInterval(timer);
  const drill = DRILLS[order[idx]];
  renderGrid(applyMove(currentGrid, drill.correct_move_uci));
  showFeedback(false, drill, true);
  results.push({ source: drill.source, correct: false, elapsed });
}

function showFeedback(isRight, drill, skipped, isPrimary) {
  const fb = document.getElementById("feedback");
  fb.className = isRight ? "correct" : "wrong";
  const correctSan = drill.correct_move_san ? drill.correct_move_san : drill.correct_move_uci;
  let headline;
  if (skipped) {
    headline = `Skipped. The move was ${correctSan}.`;
  } else if (isPrimary) {
    headline = `Right -- ${correctSan}.`;
  } else if (isRight) {
    headline = `Right -- that works too (within a few points of ${correctSan}, the engine's top pick).`;
  } else {
    headline = `Not quite. The move was ${correctSan}.`;
  }
  const withinTarget = elapsed <= DRILL_SECONDS;
  const timeTag = `<div class="time-tag">${elapsed}s -- ${withinTarget ? "within" : "over"} your ${DRILL_SECONDS}s target</div>`;
  const explanationHtml = drill.explanation
    ? `<div id="explanation">${drill.explanation}</div>`
    : "";
  fb.innerHTML = `<span id="feedbackMove">${headline}</span>${timeTag}${explanationHtml}`;
  document.getElementById("nextBtn").disabled = false;
  document.getElementById("skipBtn").disabled = true;
}

function startStopwatch() {
  elapsed = 0;
  updateClock();
  timer = setInterval(() => {
    elapsed += 1;
    updateClock();
  }, 1000);
}

function updateClock() {
  const el = document.getElementById("clock");
  el.textContent = elapsed;
  el.classList.toggle("over-target", elapsed > DRILL_SECONDS);
}

function loadDrill() {
  committed = false;
  selected = null;
  if (timer) clearInterval(timer);
  document.getElementById("feedback").className = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("skipBtn").disabled = false;
  document.getElementById("targetLabel").textContent = `target ${DRILL_SECONDS}s`;
  document.getElementById("counter").textContent = `Drill ${idx + 1} / ${order.length}`;
  const drill = DRILLS[order[idx]];
  renderBoard(drill.fen);
  startStopwatch();
}

function nextDrill() {
  idx += 1;
  if (idx >= order.length) {
    showSummary();
  } else {
    loadDrill();
  }
}

function showSummary() {
  document.getElementById("quiz").style.display = "none";
  const summary = document.getElementById("summary");
  summary.style.display = "block";
  const bySource = {};
  for (const r of results) {
    bySource[r.source] = bySource[r.source] || { correct: 0, total: 0 };
    bySource[r.source].total += 1;
    if (r.correct) bySource[r.source].correct += 1;
  }
  const labels = { own_blunder: "Your past blunders", own_null: "Your quiet positions", lichess_puzzle: "Puzzle pool" };
  const total = results.length;
  const totalCorrect = results.filter(r => r.correct).length;
  const withinTarget = results.filter(r => r.elapsed <= DRILL_SECONDS).length;
  let rows = `<tr><td><strong>Overall</strong></td><td>${totalCorrect} / ${total}</td></tr>`;
  for (const [src, v] of Object.entries(bySource)) {
    rows += `<tr><td>${labels[src] || src}</td><td>${v.correct} / ${v.total}</td></tr>`;
  }
  rows += `<tr><td>Within ${DRILL_SECONDS}s target</td><td>${withinTarget} / ${total}</td></tr>`;
  document.getElementById("summaryTable").innerHTML = rows;
}

function start() {
  order = shuffledOrder(DRILLS.length);
  idx = 0;
  results = [];
  document.getElementById("quiz").style.display = "block";
  document.getElementById("summary").style.display = "none";
  loadDrill();
}

document.getElementById("skipBtn").addEventListener("click", skip);
document.getElementById("nextBtn").addEventListener("click", nextDrill);
document.getElementById("restartBtn").addEventListener("click", start);
start();
</script>
